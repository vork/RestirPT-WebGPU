<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --surface-2: #f3f2ef; --ink: #0b0b0b; --ink-2: #52514e; --rule: #e4e3df;
  --good: #0ca30c; --critical: #d03b3b; --muted: #8a8984;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --surface-2: #242423; --ink: #ffffff; --ink-2: #c3c2b7; --rule: #383835; --muted: #9a998f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --surface-2: #242423; --ink: #ffffff; --ink-2: #c3c2b7; --rule: #383835; --muted: #9a998f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { font-size: 22px; margin: 0 0 4px; }
header p { margin: 0; color: var(--ink-2); }
.status { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0 8px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 600; font-size: 12px;
  border: 1px solid currentColor; white-space: nowrap; }
.badge.pass { color: var(--good); }
.badge.fail { color: var(--critical); }
.badge.na { color: var(--muted); }
section { margin-top: 28px; }
h2 { font-size: 17px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
h3 { font-size: 14px; color: var(--ink-2); margin: 16px 0 6px; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; background: var(--surface-2); }
code { font-size: 12px; word-break: break-all; }
.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; }
figure { margin: 0; background: #fcfcfb; border: 1px solid var(--rule); border-radius: 6px; padding: 8px; }
figure img { width: 100%; height: auto; display: block; }
figcaption { color: #52514e; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<main>
<header>
  <h1>$title</h1>
  <p>compare.py · mode $mode · $subtitle</p>
</header>
<div class="status">$status_badge <span>failed gating checks: $failed</span></div>
$sections
</main>
</body>
</html>
